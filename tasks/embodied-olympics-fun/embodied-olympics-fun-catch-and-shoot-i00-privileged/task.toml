schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-catch-and-shoot-i00-privileged"
description = "Embodied Olympics catch-and-shoot (one Unitree H1-2 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Catch and shoot: catch the chest pass that comes to you from the left wing with your two hands, then shoot from where you stand so that the ball enters the basket from above. A referee of events, geometry and contact rules decides the success."
authors = [{ name = "Kangrui Wang" }]
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "trajectory", "catch-and-shoot"]

[metadata]
author_name = "Kangrui Wang"
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-h1-2"
family = "catch_and_shoot"
category = "basketball-and-rackets"
mode = "privileged"
dynamics = "dynamic"              # scene dynamics (docs/protocol/README.md §2.14): the task's own declaration
network = "open"                 # the agent's egress (docs/protocol/README.md §2): open, the author's choice
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 10.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: The chest pass is thrown by a physical two-wheel passing machine on the left wing, where a passer would stand, 4.0 m from the aim point: the shared ball machine block, copied byte for byte. It uses the football preset's 0.40 m pneumatic wheels on 15 N m speed-controlled motors with a size-7 ball: contact stiffness 42 kN/m from K = 2 pi r p at 0.56 bar, the pressure printed on match balls; restitution 0.85. A force-limited gate and ram feed the ball into the wheels. Nothing is pinned and no velocity is written after reset; the test checks the Task source and that the world has no pins or mocap bodies. The machine is trimmed in this world: the ball leaves the wheels at 2.00 s at 9.00 m/s, 12.7 degrees up, and passes 2 mm from the aim point 0.44 s later at 8.4 m/s. The test's positive is a declared magic action: real: the open two-hand catch pose before the pass; injected: the passed ball put at rest between the palms within 0.6 m; real: the arms squeeze and both hands close (the catch); injected at the shot: the ball's 52-degree shot velocity; the flight, the ring and the referee are real; the same state hash twice. Nop: not caught (deterministic). The real pass at the open hands is not caught. Negatives: hands opened, a shot 1 m wide, held to time, walking with the ball, a dragged pivot foot, a third step, a touch before the pass, the pass at the thigh, retouched after the release, up through the ring, a fall. In the ball-held arm stress the hands are penetrated by at most 0.9 mm. Collision stress scan: the machine raises no flags in the nop, torque, sweep and walk episodes. Flags appear only when the robot is placed in the machine's throat and drives its shoulder into it. The ram is pushed 5 cm past its stop, and the pinched ball gains 50 J. Header shows the same issue in the shared block. RTF (physics only, start command held, 4 x 10 s): 0.91 on a slower host, about 2.0-2.5 on the workstation (free-throw 0.84 in the same run).; human review in the pull request that adds the benchmark (PROTOCOL §2.7)"

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 2.0
min_memory_gb = 4.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 3.0
verifier_min_gpu_memory_gb = 0.0
measured = "author estimate (an RTX 4090 workstation, 2026-10-11): CPU-only MuJoCo with OSMesa rendering; one world steps 5 times faster than real time on one core and holds about 0.4 GB; the verifier runs two replays and a filmed one"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 0.0
max_memory_gb = 13.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 13.0
measured = "author estimate: no trials yet; memory under the 16 GiB cap by the margin the monitor needs (an agent may run several worlds at once or train a controller); disk 20 GiB for downloaded tools and controllers; processes 512: design default"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 8.0, memory_gb = 16.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = []

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in two fresh processes, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open (Harbor's default), as `[metadata] network` declares. Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
